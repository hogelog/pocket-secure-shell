version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns:
          - "*"
    ignore:
      # Pinned in app/build.gradle.kts to the Kotlin bundled by AGP; newer
      # versions break compileDebugKotlin with a metadata version mismatch.
      - dependency-name: "org.jetbrains.kotlin:kotlin-stdlib-common"
